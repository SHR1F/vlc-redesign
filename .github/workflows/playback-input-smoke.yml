name: Playback input regression

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Repository owning the build
        required: true
        default: SHR1F/vlc-redesign
        type: string
      run_id:
        description: Completed Windows package build run
        required: true
        type: string
      artifact_name:
        description: Exact Windows package artifact
        required: true
        type: string
      baseline:
        description: Record unchanged upstream Hide UI behavior
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  playback-input:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          sparse-checkout: extras/juxtopposed/ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          repository: ${{ inputs.repository }}
          run-id: ${{ inputs.run_id }}
          name: ${{ inputs.artifact_name }}
          path: package
      - name: Check playback controls on the CI desktop
        shell: pwsh
        env:
          VLC_BASELINE: ${{ inputs.baseline }}
        run: |
          $parameters = @()
          if ($env:VLC_BASELINE -eq 'true') { $parameters += '--baseline' }
          python extras/juxtopposed/ci/playback_input_smoke.py package "${{ runner.temp }}/playback-input" @parameters
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: playback-input-logs-${{ inputs.run_id }}
          path: ${{ runner.temp }}/playback-input/*.log
          retention-days: 7
