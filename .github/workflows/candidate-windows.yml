name: Candidate Windows validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  win64:
    # pinned: ubuntu-latest moves to a new release under the build
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # the prebuilt contrib archive is named after the commit that last
          # touched contrib/ and the packaging
          fetch-depth: 0

      # GitHub's Ubuntu image keeps ~14 GB free; the build (image, contribs,
      # objects, packages) came within bytes of it ("No space left on
      # device" on an ARM64 run): the SDKs it never uses go first
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup                       /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift
          sudo docker image prune --all --force > /dev/null
          df -h /

      - name: Build image
        run: docker build -t vlc-win64-redesign -f extras/juxtopposed/win64.Dockerfile extras/juxtopposed

      - name: Prebuilt contribs
        run: |
          mkdir -p cache
          for sha in $(git rev-list -n 20 HEAD -- extras/tools contrib extras/ci extras/package/win32); do
            name="vlc-contrib-x86_64-w64-mingw32-$sha.tar.zst"
            if curl -fsSL --retry 3 -o "cache/$name" "https://artifacts.videolan.org/vlc/win64/$name"; then
              echo "CONTRIB=$name" >> "$GITHUB_ENV"; break
            fi
            rm -f "cache/$name"
          done
          test -n "$(ls cache)"

      - name: Build
        run: |
          mkdir -p out
          docker run --rm -u root -v vlc-build:/build vlc-win64-redesign chown videolan:videolan /build
          # the image's user is not the runner's: let it write the package
          # (and the symbol maps)
          mkdir -p symbols
          chmod 777 out symbols
          docker run --rm \
            -e CONTRIB_ARCHIVE="/cache/$CONTRIB" -e STRIP=1 -e SYMBOLS=/symbols \
            -v "$PWD:/src:ro" -v "$PWD/cache:/cache:ro" -v "$PWD/out:/out" -v "$PWD/symbols:/symbols" -v vlc-build:/build \
            vlc-win64-redesign sh -c 'cp /src/extras/juxtopposed/win64-docker.sh /tmp/build.sh && exec sh /tmp/build.sh -r'
          test -s out/vlc.exe
          test -s out/plugins/gui/libqt_plugin.dll

      - name: Lint changed QML
        run: |
          docker run --rm -v vlc-build:/build -v "$PWD:/src:ro" vlc-win64-redesign \
            sh /src/extras/juxtopposed/qmllint-docker.sh \
            modules/gui/qt/player/qml/MinimalView.qml \
            modules/gui/qt/player/qml/PlayerView.qml \
            modules/gui/qt/player/qml/PlayerToast.qml > qmllint.log
          cat qmllint.log
          if grep -q '^Error:' qmllint.log; then exit 1; fi

      # (pull requests too: the launch test runs on it)
      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vlc-redesign-win64-${{ github.sha }}
          path: out
          retention-days: ${{ github.event_name == 'pull_request' && 2 || 7 }}

      # the function addresses of the binaries before they were stripped (see
      # SYMBOLS in win64-docker.sh): with them, the offsets in a crash dump of
      # the launch test name functions
      - name: Upload the symbol maps
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vlc-redesign-win64-symbols-${{ github.sha }}
          path: symbols
          retention-days: ${{ github.event_name == 'pull_request' && 2 || 7 }}

  # The package started and a clip played on Windows (a runner without a GPU
  # or a sound card): the window opens, VLC quits when asked, the clip plays
  # to its end, no QML warning is logged
  launch-test:
    needs: win64
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: extras/juxtopposed/ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: vlc-redesign-win64-${{ github.sha }}
          path: package

      # a crash of vlc.exe leaves a full dump (Windows Error Reporting), uploaded
      # with the logs: a crash that happens on the runner and not elsewhere can
      # still be read (the call stacks with the modules and their offsets, and
      # the heap: a minidump could not tell a freed object from a missing page;
      # the vlc-redesign-win64-symbols artifact names the functions)
      - name: Keep crash dumps
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\vlc.exe'
          New-Item -Force $key | Out-Null
          New-ItemProperty -Force $key -Name DumpFolder -PropertyType ExpandString -Value "${{ runner.temp }}\vlc-launch-test\dumps" | Out-Null
          New-ItemProperty -Force $key -Name DumpType -PropertyType DWord -Value 2 | Out-Null
          New-ItemProperty -Force $key -Name DumpCount -PropertyType DWord -Value 5 | Out-Null

      - name: Launch and play
        shell: pwsh
        run: ./extras/juxtopposed/ci/launch-test.ps1 -VlcDir package -WorkDir "${{ runner.temp }}"

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: launch-test-${{ github.sha }}
          path: |
            ${{ runner.temp }}/vlc-launch-test/*.txt
            ${{ runner.temp }}/vlc-launch-test/*.log
            ${{ runner.temp }}/vlc-launch-test/dumps/*.dmp
          retention-days: 7

